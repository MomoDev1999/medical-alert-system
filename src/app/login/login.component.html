<body>
  <div
    class="container d-flex justify-content-center align-items-center vh-100"
  >
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header">
            <i class="bi bi-heart-pulse-fill"></i>
            <h4 class="mb-0 fw-bold">Sistema Médico</h4>
          </div>
          <div class="card-body">
            <form [formGroup]="loginForm" (ngSubmit)="login()">
              <!-- Correo Electrónico -->
              <div class="mb-4">
                <label for="email" class="form-label">
                  Correo Electrónico</label
                >
                <input
                  id="email"
                  formControlName="email"
                  type="email"
                  class="form-control"
                  placeholder="maria.gomez@hotmail.com"
                  [ngClass]="{
                    'is-invalid':
                      loginForm.get('email')?.invalid &&
                      loginForm.get('email')?.touched
                  }"
                  required
                />
                <div
                  *ngIf="
                    loginForm.get('email')?.invalid &&
                    loginForm.get('email')?.touched
                  "
                  class="invalid-feedback"
                >
                  Ingresa un correo válido, como "usuariocorreo.com".
                </div>
              </div>

              <!-- Contraseña -->
              <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <input
                  id="password"
                  formControlName="password"
                  type="password"
                  class="form-control"
                  placeholder="&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;"
                  [ngClass]="{
                    'is-invalid':
                      loginForm.get('password')?.invalid &&
                      loginForm.get('password')?.touched
                  }"
                  required
                />
                <div
                  *ngIf="
                    loginForm.get('password')?.invalid &&
                    loginForm.get('password')?.touched
                  "
                  class="invalid-feedback"
                >
                  Asegúrate de usar al menos 8 caracteres.
                </div>
              </div>

              <!-- Botón de Iniciar Sesión -->
              <div class="d-grid mb-3">
                <button
                  type="submit"
                  class="btn btn-primary"
                  [disabled]="loginForm.invalid"
                >
                  Iniciar Sesión
                </button>
              </div>
            </form>
          </div>
          <div class="card-footer text-center">
            <p class="footer-text">
              ¿No tienes una cuenta?
              <a href="/registrar" class="text-primary">Regístrate aquí</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
